<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171817" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <title>Henry Goldsmith — Software, evidence-first</title>
  <meta name="description" content="Projects by Henry Goldsmith, each with a stage label, the numbers behind it and a link to the source. Prototypes are labelled as prototypes." />
  <meta name="author" content="Henry Goldsmith" />

  <!--
    These are the crawler-visible defaults. SiteMetadata rewrites them per route
    at runtime; a crawler that does not execute JavaScript still gets a correct
    card for the landing page.

    og:image is a PNG, not an SVG: most crawlers refuse to render SVG cards.
    Cards are generated by scripts/generate-og.mjs into /og.
  -->
  <meta property="og:site_name" content="Henry Goldsmith" />
  <meta property="og:title" content="Henry Goldsmith — Software, evidence-first" />
  <meta property="og:description" content="Projects with a stage label, the numbers behind them, and a link to the source." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:image" content="/og/default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Henry Goldsmith — build it, measure it, say what it does." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Henry Goldsmith — Software, evidence-first" />
  <meta name="twitter:description" content="Projects with a stage label, the numbers behind them, and a link to the source." />
  <meta name="twitter:image" content="/og/default.png" />

  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
