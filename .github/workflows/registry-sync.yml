name: Registry sync

# Re-imports the monorepo registry, the evidence ledger, CI facts and source
# statuses, then opens an auto-merged PR if anything changed. This is what makes
# the portfolio track the ecosystem instead of drifting from it: a project
# renamed, retired, archived or promoted upstream shows up here without anyone
# remembering to edit the site.
#
# The health gate exists because a dead REGISTRY_TOKEN used to degrade
# silently: the import kept stale facts, verify:sources skipped itself, and
# the job still passed green. Now that state fails the job instead.

on:
  schedule:
    # 06:20 UTC Mondays, plus every push to main so facts stay fresh between
    # weekly sweeps. Both paths are cheap when nothing changed.
    - cron: "20 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the post-refresh tree (bot pushes don't trigger it)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Record the facts timestamp before importing
        id: prev-facts
        run: |
          ts=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('registry/ci-facts.json','utf8')).importedAt||'')}catch{console.log('')}")
          echo "imported_at=$ts" >> "$GITHUB_OUTPUT"

      - name: Import registry, evidence ledger, source status and CI facts
        env:
          # A PAT with actions:read widens private-repo coverage; the built-in
          # token covers everything public, which is all this site cites today.
          # The import fails loudly rather than writing empty facts when the
          # token cannot see what it should.
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run registry:import:ci

      - name: Fail if the import ran without repository access
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          PREVIOUS_FACTS_IMPORTED_AT: ${{ steps.prev-facts.outputs.imported_at }}
        run: node scripts/check-pipeline-health.mjs

      - name: Verify every cited source path still exists
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run verify:sources

      - name: Collect deployment, release and vulnerability facts
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run registry:facts

      - name: Regenerate OG cards and sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bun run prebuild

      - name: Validate before proposing anything
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          bun run registry:validate
          bun run audit:claims
          bun run check:links --github

      - name: Summarise what changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No registry changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF'
            git diff --stat
            echo EOF
          } >> "$GITHUB_OUTPUT"
          # Generated layers are machine output by definition — they can land
          # on main directly. Anything else (a case study edited by automation,
          # say) deserves human review via PR.
          generated='^(public/og/|public/sitemap\.xml$|public/robots\.txt$|registry/(ci-facts|upstream|evidence-ledger|source-status)\.json$)'
          if git diff --name-only | grep -qvE "$generated"; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated refreshes straight to main
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.mode == 'direct'
        run: |
          git config user.name "henry-builds-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated evidence data

          Automated import: upstream registry, evidence ledger, source status,
          CI facts, OG cards and sitemap. Machine output only — no narrative
          was touched."
          git push origin HEAD:main

      - name: Verify the post-refresh tree (bot pushes don't trigger CI)
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.mode == 'direct'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Open or update a pull request
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.mode == 'pr'
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: chore/registry-sync
          title: "chore: sync project registry from monorepo"
          commit-message: "chore: sync project registry from monorepo"
          delete-branch: true
          body: |
            Automated import from `henrygoldsmith07-wq/Claude-Code:apps/registry.json`,
            `evidence/registry.json`, live CI facts and source-path verification.

            ```
            ${{ steps.diff.outputs.summary }}
            ```

            Check before merging:

            - A project whose upstream lifecycle became `active` will now publish.
              `registry:validate` reports any publish gate that has opened.
            - Test counts marked "from CI" replace the authored figures in the
              case studies. If a count moved a long way, confirm the workflow ran
              the suite you expect.
            - Projects whose source disappeared are archived automatically
              (`stage: archived`); featured slots freed this way must be refilled.

      - name: Enable auto-merge so facts never sit stale for days
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true # repos without auto-merge enabled still get their PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
