name: Registry sync

# Re-imports the monorepo registry and CI facts daily, auto-archives projects
# whose source has disappeared, validates everything (including upstream repo
# paths), then either commits generated-only changes straight to main or opens
# a PR when something needs a human decision.
#
# This is what makes the portfolio track the source of truth instead of
# drifting from it: a project renamed, retired or promoted upstream shows up
# here without anyone remembering to edit the site.

on:
  schedule:
    # 06:20 UTC every day. Off the hour so it does not queue behind the
    # every-scheduler-runs-at-:00 crowd.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Import registry and CI facts
        env:
          # A PAT with actions:read on the monorepo. Without it the import still
          # succeeds — it records run metadata only and omits test counts rather
          # than inventing them.
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run registry:import:ci

      - name: Auto-archive projects whose source disappeared
        run: bun run archive:removed

      - name: Regenerate OG cards and sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bun run prebuild

      - name: Validate before proposing anything
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          bun run registry:validate
          bun run audit:claims

      - name: Verify evidence paths exist upstream
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run check:links:full

      - name: Summarise what changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No registry changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<EOF'
              git diff --stat
              echo EOF
            } >> "$GITHUB_OUTPUT"

            # Generated-only changes are mechanical facts about CI and the
            # monorepo — they go straight to main so the site's dates stay
            # fresh without a human merging a PR every day.
            generated_only=true
            for f in $(git diff --name-only); do
              case "$f" in
                registry/ci-facts.json|registry/upstream.json|public/og/*|public/sitemap.xml|public/robots.txt)
                  ;;
                *)
                  generated_only=false
                  ;;
              esac
            done
            echo "generated_only=$generated_only" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated facts to main
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.generated_only == 'true'
        run: |
          git config user.name "registry-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh CI facts and registry snapshot"
          git push

      - name: Open a pull request for anything needing review
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.generated_only != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/registry-sync
          title: "chore: sync project registry from monorepo"
          commit-message: "chore: sync project registry from monorepo"
          delete-branch: true
          draft: true
          body: |
            Automated import from `henrygoldsmith07-wq/Claude-Code:apps/registry.json`.

            This PR touches more than generated files — likely a project was
            added, removed or re-lifecycle'd upstream, which changes what this
            site publishes.

            ```
            ${{ steps.diff.outputs.summary }}
            ```

            Check before merging:

            - A project whose source was removed is now a historical case study.
              `bun run archive:removed` did that automatically; sanity-check the
              wording of its banner.
            - A project whose upstream lifecycle became `active` will now publish.
              `registry:validate` reports any publish gate that has opened.
            - Test counts marked "from CI" replace the authored figures in the
              case studies. If a count moved a long way, confirm the workflow ran
              the suite you expect.

      - name: Report validation failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Registry sync failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "registry",
            });
            const body = [
              "The scheduled registry sync or its validation failed.",
              "",
              "[Workflow run](" + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId + ")",
            ].join("\n");
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["registry"],
              });
            }
