name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The registry-sync bot's own commits do not trigger push runs (GitHub rule),
  # so sync dispatches CI explicitly on the post-refresh tree.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}
  VITE_SITE_URL: ${{ vars.SITE_URL }}

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, registry, sources, claims, build, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap lastmod derives from per-file commit history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The registry gates everything else: if a claim has no evidence, a stage
      # label is not earned, or a cited source path is gone, nothing downstream
      # is worth running.
      - name: Validate registry against the evidence layer
        run: bun run registry:validate

      - name: Verify every cited source path exists
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bun run verify:sources

      - name: Audit public claims
        run: bun run audit:claims

      - name: Type-check
        run: bunx tsc -b

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check internal links, assets and sitemap
        run: bun run check:links --github
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Fail if generated files are stale
        # The build regenerates OG cards and the sitemap. If either differs from
        # what is committed, the repository is out of date with the registry.
        run: |
          if ! git diff --quiet -- public/og public/sitemap.xml public/robots.txt; then
            echo "::error::Generated files are stale. Run 'bun run prebuild' and commit the result."
            git diff --stat -- public/og public/sitemap.xml public/robots.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 3

  accessibility:
    name: Accessibility audit
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Run axe over every published route, light and dark
        run: bun run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Compare against committed snapshots
        run: bun run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Assert performance, a11y, best-practices and SEO budgets
        run: bunx lhci autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
