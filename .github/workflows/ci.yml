name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}
  VITE_SITE_URL: ${{ vars.SITE_URL }}

jobs:
  verify:
    name: Types, lint, registry, claims, evidence tests, build, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The registry gates everything else: if a claim has no evidence, or a
      # stage label is not earned, nothing downstream is worth running.
      - name: Validate registry
        run: bun run registry:validate

      - name: Fail if removed projects are not yet archived
        # Catches hand-edits that reintroduce a project whose source upstream is
        # gone, or an un-committed auto-archive from the sync workflow.
        run: bun run archive:removed:check

      # Restore the per-text classifier cache BEFORE any classifier-assisted
      # step runs. Offline CI relies on this cache, and even online CI must
      # not repeat external classifier.dev requests for claims whose per-text
      # hash is already cached. The cache key mirrors the source-hash inputs:
      # taxonomy file + every registry source of claim text.
      - name: Restore classifier cache
        uses: actions/cache@v4
        with:
          path: .cache/classifier-v1.json
          key: classifier-${{ hashFiles('scripts/lib/claim-taxonomy.mjs') }}-${{ hashFiles('registry/case-studies/*.json', 'registry/evidence-ledger.json') }}
          restore-keys: classifier-

      - name: Audit public claims
        # Deterministic regex bans stay authoritative; classifier assist inside
        # is advisory-only and writes a metadata-only report (no claim text).
        run: bun run audit:claims -- --report classifier-report.json

      # The evidence gates are code too. Exercise them against fixtures so
      # a threshold or regex change cannot silently weaken the site.
      - name: Test the evidence machinery
        run: bun run test:evidence

      - name: Classify claims (evidence assist, advisory only)
        # classifier.dev identifies claim TYPE only; it never decides proof.
        # Offline fallback keeps the build green when the service is down.
        # classify-claims reuses its committed report when the source hash
        # matches, so this is a no-op on a cache hit instead of an online call.
        run: |
          bun run classify:claims || bun run classify:claims:offline
          bun run classify:validate

      - name: Classifier report (category, confidence, rule)
        if: always()
        run: |
          node -e "const r=require('./classifier-report.json');for(const i of r.items)console.log(i.id+' | '+i.category+' | '+i.confidence+' | '+i.rule+' | '+i.status)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classifier-report
          path: |
            classifier-report.json
            .cache/classifier-v1.json
          retention-days: 7

      - name: Type-check
        run: bunx tsc -b

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check internal links, assets and sitemap
        run: bun run check:links

      - name: Fail if generated files are stale
        # The build regenerates OG cards and the sitemap. If either differs from
        # what is committed, the repository is out of date with the registry.
        run: |
          if ! git diff --quiet -- public/og public/sitemap.xml public/robots.txt; then
            echo "::error::Generated files are stale. Run 'bun run prebuild' and commit the result."
            git diff --stat -- public/og public/sitemap.xml public/robots.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 3

  accessibility:
    name: Accessibility audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium

      - name: Run axe over every published route, light and dark
        run: bun run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium

      - name: Compare against committed snapshots
        run: bun run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Assert performance, a11y, best-practices and SEO budgets
        run: bunx lhci autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
