name: Deployment monitor

# Probes the live site on a schedule and opens an issue when it breaks.
#
# CI proves the build is good; this proves what is actually served is good.
# Those come apart in the ways that matter most — a bad rewrite rule, an expired
# certificate, a deploy that silently served the previous build.

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Probe live routes, assets and metadata
        id: probe
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set +e
          bun run scripts/probe-deployment.mjs > probe.log 2>&1
          status=$?
          set -e
          {
            echo 'log<<EOF'
            cat probe.log
            echo EOF
          } >> "$GITHUB_OUTPUT"
          cat probe.log
          exit $status

      - name: External evidence links still resolve
        if: success()
        run: bun run check:links:external
        continue-on-error: true

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const log = `${{ steps.probe.outputs.log }}`;
            const title = "Deployment probe failed";

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "deployment",
            });

            const body = [
              `The scheduled probe of \`${{ vars.SITE_URL }}\` failed.`,
              "",
              "```",
              log.slice(0, 60000),
              "```",
              "",
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["deployment"],
              });
            }
