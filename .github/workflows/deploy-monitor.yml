name: Deployment monitor

# Probes the live site on a schedule and opens an issue when it breaks.
#
# CI proves the build is good; this proves what is actually served is good.
# Those come apart in the ways that matter most — a bad rewrite rule, an expired
# certificate, a deploy that silently served the previous build.
#
# The issue is the alarm, not a diary: a repeat failure only comments when the
# failure signature changes, so a real outage cannot hide under six hours of
# identical noise.

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Probe live routes, assets and metadata
        id: probe
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set +e
          bun run scripts/probe-deployment.mjs > probe.log 2>&1
          status=$?
          set -e
          cat probe.log
          # The signature is the set of failing lines — identical failures
          # hash identically, new failures do not.
          sig=$(grep '^✗' probe.log | sort | sha256sum | cut -d' ' -f1)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          exit $status

      - name: External evidence links still resolve
        if: always()
        id: links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-links.mjs --external > links.log 2>&1
          status=$?
          set -e
          cat links.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0 # advisory here; the scheduled registry-sync gate fails on it

      - name: Open or update one issue on failure
        if: failure() || steps.links.outputs.status == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const probeFailed = `${{ job.status }}` === "failure";
            const signature = `${{ steps.probe.outputs.signature }}`;
            const title = "Deployment probe failing";

            const sections = [];
            if (probeFailed) {
              sections.push(
                "## Probe output\n\n```\n" +
                  fs.readFileSync("probe.log", "utf8").slice(0, 30000) +
                  "\n```",
              );
            }
            try {
              const links = fs.readFileSync("links.log", "utf8");
              const broken = (links.match(/✗/g) ?? []).length;
              if (broken > 0) {
                sections.push(
                  "## External evidence links broken (" + broken + ")\n\n```\n" +
                    links.split("\n").filter((l) => l.startsWith("✗")).join("\n") +
                    "\n```",
                );
              }
            } catch {}

            const body = [
              `Scheduled check of \`${{ vars.SITE_URL }}\`.`,
              "",
              ...sections,
              "",
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            // One open issue at most. Comment only when the failure signature
            // changed — an unchanged outage stays quiet until it evolves.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "deployment",
              per_page: 100,
            });
            const open = existing.data.find((issue) => issue.title === title);

            let lastSignature = "";
            try {
              lastSignature =
                /\[signature: ([0-9a-f]+)\]/.exec(open?.body ?? "")?.[1] ?? "";
            } catch {}

            const suffix = `\n\n[signature: ${signature}]`;

            if (!open) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: body + suffix,
                labels: ["deployment"],
              });
              return;
            }

            const recoveredButIssueOpen = !probeFailed && !sections.some((s) => s.includes("✗"));
            if (recoveredButIssueOpen) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Probe passed on this run — closing.\n\n${body}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: "closed",
              });
              return;
            }

            if (signature && signature !== lastSignature) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Failure signature changed.\n\n${body}${suffix}`,
              });
            } else if (!signature) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            }
